name: release

on:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Setup uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen
      - name: Build Windows binary
        run: uv run pyinstaller main.py --onefile --noconsole --name "Assassin-${{ github.ref_name }}-windows"
      - name: Package Windows zip
        run: |
          Rename-Item "dist\Assassin-${{ github.ref_name }}-windows.exe" "Assassin.exe"
          if (-Not (Test-Path "dist\assets")) { New-Item -ItemType Directory -Path "dist\assets" | Out-Null }
          Copy-Item -Recurse -Force "assets\*" "dist\assets\"
          Compress-Archive -Path "dist\Assassin.exe", "dist\assets" -DestinationPath "dist\Assassin-${{ github.ref_name }}-windows.zip"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: assassin-windows
          path: dist/Assassin-${{ github.ref_name }}-windows.zip

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libglib2.0-0 libdbus-1-3 \
            libfontconfig1 libfreetype6 libxkbcommon-x11-0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-xinerama0 libxcb-xinput0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Setup uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen
      - name: Build Linux binary
        run: uv run pyinstaller main.py --onefile --name "Assassin-${{ github.ref_name }}-linux"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: assassin-linux
          path: dist/Assassin-${{ github.ref_name }}-linux

  release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: assassin-windows
          path: artifacts
      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: assassin-linux
          path: artifacts
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -e
          windows_file="artifacts/Assassin-${TAG}-windows.zip"
          linux_file="artifacts/Assassin-${TAG}-linux"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$windows_file" "$linux_file" --clobber
          else
            gh release create "$TAG" "$windows_file" "$linux_file" --title "$TAG" --notes "Automated release."
          fi
