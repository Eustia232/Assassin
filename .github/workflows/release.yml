name: release

on:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Setup uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen
      - name: Build Windows binary
        run: uv run pyinstaller main.py --onefile --noconsole --name "Assassin-${{ github.ref_name }}-windows"
      - name: Package Windows zip
        run: |
          Rename-Item "dist\Assassin-${{ github.ref_name }}-windows.exe" "Assassin.exe"
          Compress-Archive -Path "dist\Assassin.exe" -DestinationPath "dist\Assassin-${{ github.ref_name }}-windows.zip"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: assassin-windows
          path: dist/Assassin-${{ github.ref_name }}-windows.zip

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libglib2.0-0 libdbus-1-3 \
            libfontconfig1 libfreetype6 libxkbcommon-x11-0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-xinerama0 libxcb-xinput0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Setup uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen
      - name: Build with PyInstaller (onedir mode)
        run: uv run pyinstaller main.py --onedir --name Assassin
      - name: Download linuxdeploy
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          wget -c https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage
      - name: Build AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          mkdir -p AppDir/usr/bin
          cp -r dist/Assassin/* AppDir/usr/bin/

          cat > AppDir/AppRun << 'EOF'
          #!/bin/bash
          HERE="$(dirname "$(readlink -f "$0")")"
          export PATH="$HERE/usr/bin:$PATH"
          export LD_LIBRARY_PATH="$HERE/usr/lib:$LD_LIBRARY_PATH"
          export QT_PLUGIN_PATH="$HERE/usr/plugins"
          exec "$HERE/usr/bin/Assassin" "$@"
          EOF
          chmod +x AppDir/AppRun

          cat > AppDir/assassin.desktop << 'EOF'
          [Desktop Entry]
          Name=Assassin
          Exec=Assassin
          Icon=assassin
          Type=Application
          Categories=Utility;
          Terminal=false
          EOF

          python3 -c "
          import struct, zlib
          w, h = 64, 64
          raw = b''
          for y in range(h):
              raw += b'\x00'
              for x in range(w):
                  raw += struct.pack('BBBB', 66, 133, 244, 255)
          def chunk(t, d):
              c = t + d
              return struct.pack('>I', len(d)) + c + struct.pack('>I', zlib.crc32(c) & 0xffffffff)
          ihdr = struct.pack('>IIBBBBB', w, h, 8, 6, 0, 0, 0)
          with open('AppDir/assassin.png', 'wb') as f:
              f.write(b'\x89PNG\r\n\x1a\n')
              f.write(chunk(b'IHDR', ihdr))
              f.write(chunk(b'IDAT', zlib.compress(raw)))
              f.write(chunk(b'IEND', b''))
          "
          cp AppDir/assassin.png AppDir/.DirIcon

          PYSIDE_QT=$(uv run python3 -c "import PySide6, os; print(os.path.join(os.path.dirname(PySide6.__file__), 'Qt'))")
          mkdir -p AppDir/usr/plugins
          cp -r "$PYSIDE_QT/plugins/platforms" AppDir/usr/plugins/

          ./linuxdeploy-x86_64.AppImage --appdir AppDir --output appimage
      - name: Package AppImage into tar.gz
        run: |
          tar -czvf "dist/Assassin-${{ github.ref_name }}-linux.tar.gz" Assassin-x86_64.AppImage
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: assassin-linux
          path: dist/Assassin-${{ github.ref_name }}-linux.tar.gz

  release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: assassin-windows
          path: artifacts
      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: assassin-linux
          path: artifacts
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -e
          windows_file="artifacts/Assassin-${TAG}-windows.zip"
          linux_file="artifacts/Assassin-${TAG}-linux.tar.gz"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$windows_file" "$linux_file" --clobber
          else
            gh release create "$TAG" "$windows_file" "$linux_file" --title "$TAG" --notes "Automated release."
          fi
